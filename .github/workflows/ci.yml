name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run verify
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  game-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
